<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TINY GIANT STUDIO - Team</title>
    <!-- css 스타일은 index.html과 거의 동일하지만, 임시 페이지용 컨테이너 스타일만 추가했습니다. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background-color: #F0F4F8; color: #003050; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #FFFFFF; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px rgba(0, 48, 80, 0.05); position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #003050; }
        .logo-img { height: 36px; width: auto; }
        .logo-text { font-size: 24px; letter-spacing: -0.5px; }
        .logo-text span.tiny { font-weight: 300; } .logo-text span.giant { font-weight: 900; }
        
        nav ul { display: flex; list-style: none; gap: 40px; }
        nav ul li a { text-decoration: none; color: #003050; font-weight: 600; font-size: 15px; transition: opacity 0.2s; padding-bottom: 4px; border-bottom: 2px solid transparent; }
        nav ul li a:hover { opacity: 0.6; }
        nav ul li a.active { color: #4A657A; border-bottom: 2px solid #003050; }

        .team-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; }
        .team-grid { display: flex; gap: 40px; }
        .team-card { background-color: #FFFFFF; width: 300px; padding: 50px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 48, 80, 0.06); text-align: center; border-top: 5px solid #003050; transition: transform 0.3s ease; }
        .team-card:hover { transform: translateY(-5px); }
        .avatar { font-size: 50px; margin-bottom: 20px; color: #003050; }
        .member-name { font-size: 24px; font-weight: 800; margin-bottom: 5px; }
        .member-role { font-size: 15px; color: #4A657A; font-weight: bold; margin-bottom: 25px; letter-spacing: 0.5px; }
        .member-desc { font-size: 15px; color: #003050; line-height: 1.6; word-break: keep-all; }
        footer { background-color: #003050; color: #FFFFFF; text-align: center; padding: 24px; font-size: 13px; margin-top: auto; }

        @media (max-width: 768px) { .team-grid { flex-direction: column; } nav ul { gap: 20px; } }
        @media (max-width: 600px) { header { flex-direction: column; gap: 20px; padding: 20px; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="img02.png" alt="Tiny Giant Logo" class="logo-img">
            <div class="logo-text"><span class="tiny">TINY</span><span class="giant">GIANT</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">MAIN</a></li>
                <li><a href="projects.html">PROJECTS</a></li>
                <li><a href="news.html">NEWS</a></li>
                <li><a href="team.html" class="active">TEAM</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <section class="team-section">
        <div class="team-grid">
            <div class="team-card">
                <div class="avatar">👤</div>
                <h3 class="member-name">JungWoojin</h3>
                <div class="member-role">CEO</div>
                <p class="member-desc">코어 로직을 조립하고 몰입감 있는 세계를 빚어냅니다.</p>
            </div>

            <div class="team-card">
                <div class="avatar">🐾</div>
                <h3 class="member-name">Cat</h3>
                <div class="member-role">Secretary</div>
                <p class="member-desc">1순위 입사 후보.<br>이건 널 위한거야.</p>
            </div>
        </div>
    </section>

    <footer>&copy; 2026 TINY GIANT STUDIO. All rights reserved.</footer>
</body>
</html>
