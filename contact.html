<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TINY GIANT STUDIO - Contact</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background-color: #F0F4F8; color: #003050; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; position: relative; z-index: 0; }
        
        header { background-color: #FFFFFF; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px rgba(0, 48, 80, 0.05); position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #003050; }
        .logo-img { height: 36px; width: auto; }
        .logo-text { font-size: 24px; letter-spacing: -0.5px; }
        .logo-text span.tiny { font-weight: 300; } .logo-text span.giant { font-weight: 900; }
        
        nav ul { display: flex; list-style: none; gap: 40px; }
        nav ul li a { text-decoration: none; color: #003050; font-weight: 600; font-size: 15px; transition: opacity 0.2s; padding-bottom: 4px; border-bottom: 2px solid transparent; }
        nav ul li a:hover { opacity: 0.6; }
        nav ul li a.active { color: #4A657A; border-bottom: 2px solid #003050; }

        .bg-watermark {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('img01.png');
            background-repeat: no-repeat;
            background-position: right -50px bottom -50px;
            background-size: 800px;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }

        .contact-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            text-align: center;
        }

        .contact-slogan {
            font-size: 32px;
            font-weight: 800;
            color: #003050;
            line-height: 1.4;
            margin-bottom: 50px;
            word-break: keep-all;
        }

        .contact-email {
            font-size: 56px;
            font-weight: 900;
            color: #003050;
            text-decoration: none;
            transition: opacity 0.3s;
            word-break: break-all;
            display: inline-block;
            border-bottom: 4px solid #003050;
            padding-bottom: 5px;
        }

        .contact-email:hover {
            opacity: 0.7;
        }

        footer { background-color: #003050; color: #FFFFFF; text-align: center; padding: 24px; font-size: 13px; margin-top: auto; }

        @media (max-width: 900px) {
            nav ul { gap: 20px; }
            .contact-slogan { font-size: 28px; margin-bottom: 40px; }
            .contact-email { font-size: 36px; }
        }
        @media (max-width: 600px) { 
            header { flex-direction: column; gap: 20px; padding: 20px; } 
            .contact-slogan { font-size: 24px; }
            .contact-email { font-size: 26px; border-bottom: 3px solid #003050; }
        }
    </style>
</head>
<body>
    <div class="bg-watermark"></div>

    <header>
        <a href="index.html" class="logo-container">
            <img src="img02.png" alt="Tiny Giant Logo" class="logo-img">
            <div class="logo-text"><span class="tiny">TINY</span><span class="giant">GIANT</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">MAIN</a></li>
                <li><a href="projects.html">PROJECTS</a></li>
                <li><a href="news.html">NEWS</a></li>
                <li><a href="team.html">TEAM</a></li>

                <li><a href="contact.html" class="active">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-wrapper">
        <h1 class="contact-slogan">작은 픽셀 하나에서<br>시작되는 거대한 세계</h1>
        <a class="contact-email">edelvice1324@naver.com</a>
    </main>

    <footer>&copy; 2026 TINY GIANT STUDIO. All rights reserved.</footer>
</body>
</html>
