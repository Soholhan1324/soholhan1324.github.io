<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TINY GIANT STUDIO</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #F0F4F8; /* 아이스 실버 배경 */
            color: #003050; /* 프러시안 블루 텍스트 */
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 네비게이션 바 */
        header {
            background-color: #FFFFFF;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px rgba(0, 48, 80, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #003050;
        }

        /* 로고 이미지 설정 (img02.png) */
        .logo-img {
            height: 36px;
            width: auto;
        }

        .logo-text {
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .logo-text span.tiny { font-weight: 300; }
        .logo-text span.giant { font-weight: 900; }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav ul li a {
            text-decoration: none;
            color: #003050;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        nav ul li a:hover {
            opacity: 0.6;
        }

        /* 메인 히어로 섹션 */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 10%;
            background-color: #FFFFFF;
            min-height: 70vh;
        }

        .hero-text {
            flex: 1;
            max-width: 500px;
            z-index: 10;
        }

        .hero-text h1 {
            font-size: 46px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 24px;
            word-break: keep-all;
            color: #003050;
        }

        .hero-text p {
            font-size: 18px;
            color: #4A657A;
            margin-bottom: 40px;
            word-break: keep-all;
            line-height: 1.6;
        }

        .btn-primary {
            display: inline-block;
            background-color: #FFFFFF;
            color: #003050;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border: 2px solid #003050;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #003050;
            color: #FFFFFF;
        }

        /* 메인 일러스트 설정 (img01.png) */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .hero-image img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }

        /* 팀 섹션 (배경 위에 겹치게 배치) */
        .team-section {
            padding: 60px 10% 100px;
            background-color: #F0F4F8;
            margin-top: -40px; /* 위로 살짝 올려서 레이어드 효과 */
            position: relative;
            z-index: 20;
        }

        .team-grid {
            display: flex;
            gap: 30px;
        }

        .team-card {
            background-color: #FFFFFF;
            width: 280px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 48, 80, 0.06);
            text-align: center;
            border-top: 5px solid #003050;
            transition: transform 0.3s ease;
        }

        .team-card:hover {
            transform: translateY(-5px);
        }

        /* 임시 아바타 아이콘 (폰트나 이미지로 대체 가능) */
        .avatar {
            font-size: 48px;
            margin-bottom: 15px;
            color: #003050;
        }

        .member-name {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .member-role {
            font-size: 14px;
            color: #4A657A;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .member-desc {
            font-size: 14.5px;
            color: #003050;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* 푸터 */
        footer {
            background-color: #003050;
            color: #FFFFFF;
            text-align: center;
            padding: 24px;
            font-size: 13px;
            opacity: 0.95;
        }

        /* 반응형 모바일 처리 */
        @media (max-width: 900px) {
            .hero { flex-direction: column; text-align: center; padding: 50px 20px; }
            .hero-text { max-width: 100%; margin-bottom: 40px; }
            .hero-text h1 { font-size: 36px; }
            .hero-image { justify-content: center; }
            .team-section { margin-top: 0; padding: 50px 20px; }
            .team-grid { flex-direction: column; align-items: center; }
            .team-card { width: 100%; max-width: 320px; }
            nav ul { gap: 20px; }
        }
        
        @media (max-width: 600px) {
            header { flex-direction: column; gap: 20px; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- GNB 영역 -->
    <header>
        <a href="#" class="logo-container">
            <!-- 유저가 제공한 로고 이미지 연동 -->
            <img src="img02.png" alt="Tiny Giant Logo" class="logo-img">
            <div class="logo-text">
                <span class="tiny">TINY</span><span class="giant">GIANT</span>
            </div>
        </a>
        <nav>
            <ul>
                <li><a href="#projects">PROJECTS</a></li>
                <li><a href="#news">NEWS</a></li>
                <li><a href="#team">TEAM</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <!-- 메인 소개 영역 -->
    <section class="hero">
        <div class="hero-text">
            <h1>작은 픽셀 하나에서<br>시작되는 거대한 세계</h1>
            <p>타이니자이언트는 끊임없는 증명과 전략이 살아 숨 쉬는<br>깊이 있는 코어 게임을 연구하는 스튜디오입니다.</p>
            <a href="#projects" class="btn-primary">EXPLORE OUR WORK</a>
        </div>
        
        <!-- 유저가 제공한 메인 일러스트 연동 -->
        <div class="hero-image">
            <img src="img01.png" alt="Tiny Giant Hero Artwork">
        </div>
    </section>

    <!-- 팀 소개 영역 -->
    <section class="team-section" id="team">
        <div class="team-grid">
            
            <!-- 팀원 1: 대표님 -->
            <div class="team-card">
                <div class="avatar">👤</div>
                <h3 class="member-name">JungWoojin</h3>
                <div class="member-role">CEO</div>
                <p class="member-desc">코어 로직을 조립하고 몰입감 있는 세계를 빚어냅니다.</p>
            </div>

            <!-- 팀원 2: 고양이 비서 -->
            <div class="team-card">
                <div class="avatar">🐾</div>
                <h3 class="member-name">Cat</h3>
                <div class="member-role">Secretary</div>
                <p class="member-desc">1순위 입사 후보.<br>이건 널 위한거야.</p>
            </div>

        </div>
    </section>

    <footer>
        &copy; 2026 TINY GIANT STUDIO. All rights reserved.
    </footer>

</body>
</html>
