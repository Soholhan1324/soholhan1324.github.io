<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TINY GIANT STUDIO - Main</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background-color: #F0F4F8; color: #003050; line-height: 1.6; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #FFFFFF; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px rgba(0, 48, 80, 0.05); position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #003050; }
        .logo-img { height: 36px; width: auto; }
        .logo-text { font-size: 24px; letter-spacing: -0.5px; }
        .logo-text span.tiny { font-weight: 300; } .logo-text span.giant { font-weight: 900; }
        
        nav ul { display: flex; list-style: none; gap: 40px; }
        nav ul li a { text-decoration: none; color: #003050; font-weight: 600; font-size: 15px; transition: opacity 0.2s; padding-bottom: 4px; border-bottom: 2px solid transparent; }
        nav ul li a:hover { opacity: 0.6; }
        
        nav ul li a.active { color: #4A657A; border-bottom: 2px solid #003050; }

        .hero { display: flex; align-items: center; justify-content: space-between; padding: 80px 10%; background-color: #FFFFFF; flex: 1; }
        .hero-text { flex: 1; max-width: 500px; z-index: 10; }
        .hero-text h1 { font-size: 46px; font-weight: 800; line-height: 1.3; margin-bottom: 24px; color: #003050; word-break: keep-all;}
        .hero-text p { font-size: 18px; color: #4A657A; margin-bottom: 40px; line-height: 1.6; word-break: keep-all;}
        .btn-primary { display: inline-block; background-color: #FFFFFF; color: #003050; padding: 14px 28px; text-decoration: none; font-weight: bold; font-size: 15px; border: 2px solid #003050; border-radius: 4px; transition: all 0.3s; }
        .btn-primary:hover { background-color: #003050; color: #FFFFFF; }
        .hero-image { flex: 1; display: flex; justify-content: flex-end; }
        .hero-image img { max-width: 100%; height: auto; object-fit: contain; border-radius: 12px; }
        footer { background-color: #003050; color: #FFFFFF; text-align: center; padding: 24px; font-size: 13px; margin-top: auto; }

        @media (max-width: 900px) {
            .hero { flex-direction: column; text-align: center; padding: 50px 20px; }
            .hero-text { max-width: 100%; margin-bottom: 40px; }
            .hero-image { justify-content: center; }
            nav ul { gap: 20px; }
        }
        @media (max-width: 600px) { header { flex-direction: column; gap: 20px; padding: 20px; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="img02.png" alt="Tiny Giant Logo" class="logo-img">
            <div class="logo-text"><span class="tiny">TINY</span><span class="giant">GIANT</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html" class="active">MAIN</a></li>
                <li><a href="projects.html">PROJECTS</a></li>
                <li><a href="news.html">NEWS</a></li>
                <li><a href="team.html">TEAM</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>작은 픽셀 하나에서<br>시작되는 거대한 세계</h1>
            <strong>TinyGiant</strong>는 AI와 e스포츠의 혁신적인 연동을 선도하고 연구합니다.<br>
            <strong>TinyGiantStudio</strong>는 몰입감 넘치고 끊임없는 증명과 전략이 살아 숨 쉬는 깊이 있는 코어 게임을 개발합니다.
            <a href="projects.html" class="btn-primary">EXPLORE OUR WORK</a>
        </div>
        <div class="hero-image">
            <img src="img01.png" alt="Tiny Giant Hero Artwork">
        </div>
    </section>

    <footer>&copy; 2026 TINY GIANT STUDIO. All rights reserved.</footer>
</body>
</html>
