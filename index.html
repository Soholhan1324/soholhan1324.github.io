<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Giant Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f11;
            color: #f1f1f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        p {
            color: #888892;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            background-color: #1f1f23;
            border: 1px solid #2f2f36;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #a1a1aa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tiny Giant Studio</h1>
        <p>Crafting deep strategy and immersive worlds.</p>
        <div class="badge">R&D in Progress • Coming Soon</div>
    </div>
</body>
</html>
