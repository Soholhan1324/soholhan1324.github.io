<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TINY GIANT STUDIO - News</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background-color: #F0F4F8; color: #003050; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background-color: #FFFFFF; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px rgba(0, 48, 80, 0.05); position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #003050; }
        .logo-img { height: 36px; width: auto; }
        .logo-text { font-size: 24px; letter-spacing: -0.5px; }
        .logo-text span.tiny { font-weight: 300; } .logo-text span.giant { font-weight: 900; }
        
        nav ul { display: flex; list-style: none; gap: 40px; }
        nav ul li a { text-decoration: none; color: #003050; font-weight: 600; font-size: 15px; transition: opacity 0.2s; padding-bottom: 4px; border-bottom: 2px solid transparent; }
        nav ul li a:hover { opacity: 0.6; }
        nav ul li a.active { color: #4A657A; border-bottom: 2px solid #003050; }
      
        .news-section {
            flex: 1;
            padding: 80px 10%;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 40px;
            color: #003050;
            border-bottom: 2px solid #003050;
            padding-bottom: 15px;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .news-card {
            display: flex;
            background-color: #FFFFFF;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 48, 80, 0.05);
            border: 1px solid #E2E8F0;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 48, 80, 0.1);
        }

        /* 뉴스 썸네일 이미지 영역 */
        .news-image {
            width: 280px;
            min-height: 180px;
            background-color: #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .news-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .news-image .placeholder {
            color: #4A657A;
            font-size: 14px;
            font-weight: bold;
        }

        .news-content {
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .news-date {
            color: #4A657A;
        }

        .news-tag {
            background-color: #003050;
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .news-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #003050;
            line-height: 1.3;
        }

        .news-desc {
            font-size: 15px;
            color: #4A657A;
            line-height: 1.6;
            word-break: keep-all;
        }

        footer { background-color: #003050; color: #FFFFFF; text-align: center; padding: 24px; font-size: 13px; margin-top: auto; }

        @media (max-width: 768px) {
            .news-card { flex-direction: column; }
            .news-image { width: 100%; height: 200px; }
            nav ul { gap: 20px; }
        }
        @media (max-width: 600px) { 
            header { flex-direction: column; gap: 20px; padding: 20px; } 
            .section-title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <header>

        </a>

            <article class="news-card">

    <footer>&copy; 2026 TINY GIANT STUDIO. All rights reserved.</footer>
</body>
</html>
